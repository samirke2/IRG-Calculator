name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # يسمح بالتشغيل اليدوي من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Sahel font if missing
        run: |
          base=https://raw.githubusercontent.com/rastikerdar/sahel-font/master/dist
          [ -f Sahel.ttf ] || curl -fsSL -o Sahel.ttf $base/Sahel.ttf
          [ -f Sahel-Bold.ttf ] || curl -fsSL -o Sahel-Bold.ttf $base/Sahel-Bold.ttf
          ls -la *.ttf

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.1" virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: irg-calculator-apk
          path: bin/*.apk
